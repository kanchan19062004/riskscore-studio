name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riskscore
          POSTGRES_PASSWORD: riskscore
          POSTGRES_DB: riskscore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskscore -d riskscore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://riskscore:riskscore@localhost:5432/riskscore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff check
        run: ruff check app tests
      - name: Migrations apply cleanly and match models
        run: |
          alembic upgrade head
          alembic check
      - name: Pytest
        run: pytest -q

  web:
    name: Web lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
