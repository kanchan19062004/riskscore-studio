services:
  postgres:
    image: postgres:16-alpine
    container_name: riskscore-postgres
    environment:
      POSTGRES_USER: riskscore
      POSTGRES_PASSWORD: riskscore
      POSTGRES_DB: riskscore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskscore -d riskscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: riskscore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: riskscore-api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://riskscore:riskscore@postgres:5432/riskscore
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../../apps/api/app:/app/app
      - ../../apps/api/migrations:/app/migrations
      - model_artifacts:/app/artifacts

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.dev
    container_name: riskscore-web
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../../apps/web:/app
      - /app/node_modules

volumes:
  postgres_data:
  model_artifacts:
